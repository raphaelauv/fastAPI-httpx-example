[project]
name = "fastapi-httpx-example"
version = "0.1.0"
description = "Full example of FastAPI with an httpx2 client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx2[http2]",
]

[project.optional-dependencies]
server = ["uvicorn[standard]"]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
ignore_missing_imports = true
strict = true
files = ["src/fastAPI_httpx"]
